<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Team Invitation</title></head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px;">
    <h2 style="color: #059669;">You're Invited to Join {{ org_name }}</h2>
    <p>Hello,</p>
    <p>You have been invited to join <strong>{{ org_name }}</strong> on Hospitality Concierge Cloud with the role of <strong>{{ role }}</strong>.</p>
    <div style="margin: 25px 0;">
      <a href="{{ invite_url }}" style="background-color: #059669; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block;">Accept Invitation</a>
    </div>
    <p style="color: #666; font-size: 14px;">This invitation will expire in 7 days.</p>
  </div>
</body>
</html>
