<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Verify Your Email</title></head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px;">
    <h2 style="color: #2563eb;">Welcome to Hospitality Concierge Cloud</h2>
    <p>Hello {{ name }},</p>
    <p>Please verify your email address to activate your account and complete organization setup.</p>
    <div style="margin: 25px 0;">
      <a href="{{ verify_url }}" style="background-color: #2563eb; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block;">Verify Email Address</a>
    </div>
    <p style="color: #666; font-size: 14px;">If you did not register for an account, please disregard this email.</p>
  </div>
</body>
</html>
