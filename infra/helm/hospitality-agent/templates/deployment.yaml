apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospitality-agent-api
  labels:
    app: hospitality-agent-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hospitality-agent-api
  template:
    metadata:
      labels:
        app: hospitality-agent-api
    spec:
      containers:
        - name: api
          image: ghcr.io/ajimsha1080/ai-customer-service-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "8000"
          envFrom:
            - secretRef:
                name: hospitality-agent-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hospitality-agent-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hospitality-agent-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
