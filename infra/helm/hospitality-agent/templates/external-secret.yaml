apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.env.AWS_REGION | default "us-east-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Release.Name }}-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Release.Name }}-secret-store
    kind: SecretStore
  target:
    name: hospitality-agent-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /hospitality-agent-cloud/{{ .Values.env.ENVIRONMENT | default "production" }}/DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: /hospitality-agent-cloud/{{ .Values.env.ENVIRONMENT | default "production" }}/REDIS_URL
    - secretKey: SECRET_KEY
      remoteRef:
        key: /hospitality-agent-cloud/{{ .Values.env.ENVIRONMENT | default "production" }}/SECRET_KEY
