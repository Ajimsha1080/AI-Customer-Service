apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hospitality-agent-api-pdb
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: hospitality-agent-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hospitality-agent-worker-pdb
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: hospitality-agent-worker
