# =====================================================================
# Hospitality Agent Cloud - Production Redis Configuration
# =====================================================================

# Network & Security
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Authentication (Mandatory in production)
# requirepass <Set via environment / secret mounting>

# Memory Management & Eviction
# Max memory capped to prevent container OOM
maxmemory 2gb
# volatile-lru: evict keys with TTL first, protecting critical state
maxmemory-policy volatile-lru
maxmemory-samples 5

# Persistence: RDB Snapshots + AOF (Append-Only File) for zero data loss
# Save RDB snapshots:
# after 900 sec (15 min) if at least 1 key changed
save 900 1
# after 300 sec (5 min) if at least 10 keys changed
save 300 10
# after 60 sec if at least 10000 keys changed
save 60 10000

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# High Availability (Sentinel / Cluster / Replication)
# replica-read-only yes
# replica-priority 100
