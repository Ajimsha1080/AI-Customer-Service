name: Hospitality Agent Cloud CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security & Vulnerability Audits (Gitleaks, Pip, NPM, Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Clean Pip Install & Pip Audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt
          pip-audit --desc on || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: NPM Dependency Audit
        working-directory: apps/web
        run: npm audit --audit-level=high || true

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"

  lint-and-typecheck:
    name: Static Analysis & Typechecking (Ruff, Mypy, ESLint, TSC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Linters & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt

      - name: Run Ruff Python Linter
        run: ruff check .

      - name: Run Mypy Static Type Checking
        run: mypy apps services --ignore-missing-imports || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Clean NPM Install
        working-directory: apps/web
        run: npm ci

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Run TypeScript Typecheck (TSC)
        working-directory: apps/web
        run: npx tsc --noEmit

  backend-tests:
    name: Backend Tests & Disaster Recovery Drill (Postgres + pgvector + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_hospitality_agent_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Clean Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migrations & Verify Zero Drift
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test_hospitality_agent_cloud"
        run: |
          alembic upgrade head
          alembic check

      - name: Run Pytest Regression Test Suite
        env:
          ENVIRONMENT: "testing"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test_hospitality_agent_cloud"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-secret-key-for-testing-purposes-only-32bytes"
          JWT_SECRET_KEY: "ci-secret-key-for-testing-purposes-only-32bytes"
          JWT_REFRESH_SECRET_KEY: "ci-refresh-secret-key-testing-purposes-only-32bytes"
        run: pytest tests/ -v

      - name: Disaster Recovery & Database Restore Drill
        env:
          PGPASSWORD: postgres
        run: |
          pg_dump -h localhost -U postgres test_hospitality_agent_cloud > /tmp/backup.sql
          createdb -h localhost -U postgres test_restore_drill_db
          psql -h localhost -U postgres -d test_restore_drill_db < /tmp/backup.sql
          psql -h localhost -U postgres -d test_restore_drill_db -c "SELECT count(*) FROM organizations;"

  e2e-playwright:
    name: End-to-End Testing (Playwright Full Tenant Lifecycle)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, backend-tests]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_hospitality_agent_cloud
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 & Node 20
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Python & Node Dependencies
        run: |
          pip install -r requirements.txt
          cd apps/web && npm ci
          npx playwright install --with-deps chromium

      - name: Start Background API Server
        env:
          ENVIRONMENT: "testing"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test_hospitality_agent_cloud"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-secret-key-for-testing-purposes-only-32bytes"
        run: |
          alembic upgrade head
          nohup python -m uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          sleep 5
          curl -f http://localhost:8000/health || cat /tmp/api.log

      - name: Build and Start Web App
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          nohup npm start -- -p 3000 > /tmp/web.log 2>&1 &
          sleep 5
          curl -f http://localhost:3000 || cat /tmp/web.log

      - name: Execute Playwright E2E Tests
        working-directory: apps/web
        run: npx playwright test

  load-smoke-test:
    name: Load Smoke Test (k6 Concurrency & SLA Validation)
    runs-on: ubuntu-latest
    needs: [backend-tests]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies & Run Server
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./load_test.db"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-secret-key-for-testing-purposes-only-32bytes"
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup python -m uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 > /tmp/load_api.log 2>&1 &
          sleep 5

      - name: Install and Run k6 Load Test
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
          k6 run tests/load/k6_load_test.js || true

  build-and-push:
    name: Container Build, SBOM, Vulnerability Scan & Cosign Signing
    needs: [security-audit, lint-and-typecheck, backend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}

      - name: Generate SBOM for API Image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          format: spdx-json
          output-file: api-sbom.spdx.json

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          format: "table"
          exit-code: "0"

      - name: Build & Push Web Image
        id: build-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}

      - name: Generate SBOM for Web Image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          format: spdx-json
          output-file: web-sbom.spdx.json
