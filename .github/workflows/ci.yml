name: Hospitality Agent Cloud CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Pytest Suite & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify syntax & compilation
        run: |
          python -m compileall .

      - name: Run pytest test suite
        env:
          JWT_SECRET_KEY: "ci-secret-key-for-testing-purposes-only-32bytes"
          JWT_REFRESH_SECRET_KEY: "ci-refresh-secret-key-testing-purposes-only-32bytes"
          ENVIRONMENT: "testing"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest tests/ -v
